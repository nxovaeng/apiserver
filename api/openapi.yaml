  /{sub_path}/{path}:
    get:
      tags: [Subscriptions]
      summary: Public aggregated subscription endpoint (base64 default)
      description: |
        Dynamically matched against the `sub_path` setting (default `/d`).
        Exempt from Bearer token authentication and rate-limited per IP (30 req/min).
      operationId: getSubscriptionDefault
      security: []
      parameters:
        - $ref: "#/components/parameters/SubPathPrefixParam"
        - $ref: "#/components/parameters/UserSubPathParam"
      responses:
        "200":
          description: Base64-encoded subscription links
          headers:
            Subscription-Userinfo:
              schema:
                type: string
            Profile-Update-Interval:
              schema:
                type: string
            Profile-Title:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: User subscription disabled, expired, or traffic exhausted
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Subscription path not found
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Subscription rate limit exceeded
          content:
            text/plain:
              schema:
                type: string

  /{sub_path}/{path}/{format}:
    get:
      tags: [Subscriptions]
      summary: Public aggregated subscription endpoint with explicit output format
      operationId: getSubscriptionFormatted
      security: []
      parameters:
        - $ref: "#/components/parameters/SubPathPrefixParam"
        - $ref: "#/components/parameters/UserSubPathParam"
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [base64, plain, txt, t, json, j, yaml, y, clash]
      responses:
        "200":
          description: Subscription payload in requested format
          content:
            text/plain:
              schema:
                type: string
            text/yaml:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionJSONEnvelope"
        "400":
          description: Unknown subscription format
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: User subscription disabled, expired, or traffic exhausted
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Subscription path not found
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Subscription rate limit exceeded
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Static API Token (xrp_<48 chars>)"
      description: "Static Bearer token passed exclusively via `Authorization: Bearer <token>` header."

  parameters:
    IDParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    UintIDParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
    SubPathPrefixParam:
      name: sub_path
      in: path
      required: true
      description: Configured subscription prefix without leading slash (default `d` for `/d`)
      schema:
        type: string
    UserSubPathParam:
      name: path
      in: path
      required: true
      description: Unique per-user subscription path token
      schema:
        type: string
    LogServiceParam:
      name: service
      in: query
      schema:
        type: string
        enum: [xray, panel, wireguard, nginx]
        default: xray
    LogLinesParam:
      name: lines
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

  responses:
    ValidationError:
      description: Validation or request binding error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Invalid request payload
    Unauthorized:
      description: Missing, invalid, expired, or revoked Bearer API token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Invalid or revoked API token
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found
    Conflict:
      description: Resource conflict or duplicate unique field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: CONFLICT
              message: Resource already exists or port conflicts
    RateLimited:
      description: Authentication rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many failed authentication attempts, please retry later
    XrayValidationFailed:
      description: Generated Xray config failed `xray -test` validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: XRAY_VALIDATION_FAILED
              message: Xray config validation failed, service was not restarted
    SystemCommandFailed:
      description: Underlying OS or systemd command failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: SYSTEM_COMMAND_FAILED
              message: System command failed
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: Internal server error

  schemas:
    # ===== Core Error & Envelope Types =====
    ErrorCode:
      type: string
      enum:
        - UNAUTHORIZED
        - RATE_LIMITED
        - VALIDATION_ERROR
        - NOT_FOUND
        - CONFLICT
        - FORBIDDEN
        - XRAY_VALIDATION_FAILED
        - SYSTEM_COMMAND_FAILED
        - INTERNAL_ERROR

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
