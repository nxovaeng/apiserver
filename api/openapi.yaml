openapi: 3.0.3
info:
  title: Xray Panel Server API
  version: 1.0.0
  description: |
    Headless RESTful API contract for `xray-panel-server`, aligned with `xray-panel-desktop`.
    Pure Server-mode Xray/Nginx/WireGuard management with static Bearer API Token authentication.

servers:
  - url: http://127.0.0.1:8082
    description: Local or SSH-tunneled backend server
  - url: https://{domain}
    description: HTTPS reverse-proxied backend server
    variables:
      domain:
        default: panel.example.com

tags:
  - name: Health
    description: Service health probes
  - name: Auth & Tokens
    description: Static Bearer API token verification and lifecycle management
  - name: Dashboard
    description: System metrics, service states, and traffic summaries
  - name: Users
    description: Proxy user management and traffic quota controls
  - name: Inbounds
    description: Xray inbound configuration and Nginx integration
  - name: Outbounds
    description: Xray outbound configuration, share-link import, and real dial testing
  - name: Routing
    description: Xray routing rules, presets, and GeoData discovery
  - name: Domains
    description: Domain management and TLS/ACME certificate scanning
  - name: WireGuard
    description: Linux kernel WireGuard (wg0) server and peer management
  - name: Xray & System
    description: Xray service lifecycle, settings, panel restart, and service logs
  - name: Subscriptions
    description: Public unauthenticated user subscription endpoints

security:
  - BearerAuth: []

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/verify:
    get:
      tags: [Auth & Tokens]
      summary: Verify current Bearer API token and inspect server metadata
      operationId: verifyAuth
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthVerifyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tokens:
    get:
      tags: [Auth & Tokens]
      summary: List API tokens (hashed secrets are never returned)
      operationId: listTokens
      responses:
        "200":
          description: List of API tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Auth & Tokens]
      summary: Issue a new API token (plaintext is returned only once)
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tokens/{id}:
    delete:
      tags: [Auth & Tokens]
      summary: Revoke (or permanently purge) an API token
      operationId: deleteToken
      parameters:
        - $ref: "#/components/parameters/IDParam"
        - name: purge
          in: query
          description: When true, permanently delete the record instead of only marking revoked=true
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Token revoked or deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDeleteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Get server dashboard metrics, monthly traffic, and service status
      operationId: getDashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users (optionally filtered by name/email search query)
      operationId: listUsers
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring filter on user name or email
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      summary: Create a proxy user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUser
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user (preserves sub_path, traffic_used, traffic_reset, created_at)
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Users]
      summary: Delete a user
      operationId: deleteUser
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{id}/toggle:
    post:
      tags: [Users]
      summary: Toggle user enabled status
      operationId: toggleUser
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: User toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{id}/reset-traffic:
    post:
      tags: [Users]
      summary: Reset user traffic_used counter to 0
      operationId: resetUserTraffic
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Traffic reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/inbounds:
    get:
      tags: [Inbounds]
      summary: List Xray inbounds
      operationId: listInbounds
      responses:
        "200":
          description: Inbound list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Inbounds]
      summary: Create an Xray inbound (handles wildcard subdomain generation and Nginx sync)
      operationId: createInbound
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertInboundRequest"
      responses:
        "201":
          description: Inbound created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inbounds/{id}:
    get:
      tags: [Inbounds]
      summary: Get inbound by ID
      operationId: getInbound
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Inbound details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Inbounds]
      summary: Update an inbound (preserves wg_secret_key when omitted/empty; syncs Nginx)
      operationId: updateInbound
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertInboundRequest"
      responses:
        "200":
          description: Inbound updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Inbounds]
      summary: Delete an inbound and cleanup its managed Nginx configurations
      operationId: deleteInbound
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Inbound deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/inbounds/{id}/toggle:
    post:
      tags: [Inbounds]
      summary: Toggle inbound enabled status
      operationId: toggleInbound
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Inbound toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/inbounds/{id}/wg-client:
    get:
      tags: [Inbounds]
      summary: Generate WireGuard client reference config for a WireGuard relay inbound
      operationId: getInboundWGClientConfig
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: WireGuard client reference configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundWGClientConfigEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/outbounds:
    get:
      tags: [Outbounds]
      summary: List Xray outbounds
      operationId: listOutbounds
      responses:
        "200":
          description: Outbound list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Outbounds]
      summary: Create an Xray outbound
      operationId: createOutbound
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOutboundRequest"
      responses:
        "201":
          description: Outbound created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/outbounds/import:
    post:
      tags: [Outbounds]
      summary: Parse a vless://, vmess://, or trojan:// share link and create an outbound
      operationId: importOutboundShareLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportShareLinkRequest"
      responses:
        "201":
          description: Outbound imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/outbounds/parse-wireguard:
    post:
      tags: [Outbounds]
      summary: Parse a WireGuard .conf text snippet into structured outbound fields
      operationId: parseWireGuardConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseWireGuardConfigRequest"
      responses:
        "200":
          description: Parsed WireGuard fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedWireGuardConfigEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/outbounds/generate-wg-keys:
    post:
      tags: [Outbounds]
      summary: Generate a Curve25519 key pair for WireGuard outbound/inbound configuration
      operationId: generateOutboundWGKeys
      responses:
        "200":
          description: Generated key pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WGKeyPairEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/outbounds/{id}:
    get:
      tags: [Outbounds]
      summary: Get outbound by ID
      operationId: getOutbound
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Outbound details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Outbounds]
      summary: Update an outbound (empty password/wg_secret_key/trojan_password keeps existing values)
      operationId: updateOutbound
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOutboundRequest"
      responses:
        "200":
          description: Outbound updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Outbounds]
      summary: Delete an outbound
      operationId: deleteOutbound
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Outbound deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/outbounds/{id}/toggle:
    post:
      tags: [Outbounds]
      summary: Toggle outbound enabled status
      operationId: toggleOutbound
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Outbound toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/outbounds/{id}/test:
    post:
      tags: [Outbounds]
      summary: Execute a real dial test through an ephemeral Xray process for this outbound
      operationId: testOutbound
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Outbound connectivity test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundTestEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/routing:
    get:
      tags: [Routing]
      summary: List routing rules ordered by priority
      operationId: listRoutingRules
      responses:
        "200":
          description: Routing rules list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRuleListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Routing]
      summary: Create a routing rule
      operationId: createRoutingRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRoutingRuleRequest"
      responses:
        "201":
          description: Routing rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRuleEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/routing/geodata:
    get:
      tags: [Routing]
      summary: Parse geosite.dat and geoip.dat tags/country codes from Xray assets directory
      operationId: getGeoData
      responses:
        "200":
          description: GeoData tags and codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoDataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/routing/preset/{preset}:
    post:
      tags: [Routing]
      summary: Import a preset routing rule template
      operationId: importRoutingPreset
      parameters:
        - name: preset
          in: path
          required: true
          schema:
            type: string
            enum: [warp-china, warp-streaming, china-direct]
      responses:
        "200":
          description: Preset rules imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPresetEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/routing/{id}:
    get:
      tags: [Routing]
      summary: Get routing rule by ID
      operationId: getRoutingRule
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Routing rule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRuleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Routing]
      summary: Update a routing rule
      operationId: updateRoutingRule
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRoutingRuleRequest"
      responses:
        "200":
          description: Routing rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRuleEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Routing]
      summary: Delete a routing rule
      operationId: deleteRoutingRule
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Routing rule deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/routing/{id}/toggle:
    post:
      tags: [Routing]
      summary: Toggle routing rule enabled status
      operationId: toggleRoutingRule
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Routing rule toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRuleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/domains:
    get:
      tags: [Domains]
      summary: List domains with certificate expiry status
      operationId: listDomains
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Domains]
      summary: Create a domain (validates domain format, certificate paths, and wildcard SANs)
      operationId: createDomain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDomainRequest"
      responses:
        "201":
          description: Domain created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/domains/scan-certs:
    get:
      tags: [Domains]
      summary: Scan configured certificate directory (acme.sh / Let's Encrypt)
      operationId: scanCertificates
      responses:
        "200":
          description: Discovered certificates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanCertificatesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/domains/scan-import:
    post:
      tags: [Domains]
      summary: Scan certificate directory and upsert discovered domains
      operationId: scanAndImportCertificates
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanImportCertificatesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/domains/import-cert:
    post:
      tags: [Domains]
      summary: Import a single discovered certificate as a domain
      operationId: importSingleCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCertRequest"
      responses:
        "200":
          description: Imported or updated domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
